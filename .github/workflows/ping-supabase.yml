name: Ping Supabase Free Tier - MSDT

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Supabase (with retry)
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Bersihkan karakter tersembunyi (CR, spasi, newline) dari secrets
          CLEAN_URL=$(echo -n "$RAW_URL" | tr -d '\r\n' | xargs)
          CLEAN_KEY=$(echo -n "$RAW_KEY" | tr -d '\r\n' | xargs)

          echo "Cleaned URL length: ${#CLEAN_URL}"
          echo "Cleaned URL: $CLEAN_URL"

          MAX_ATTEMPTS=4
          SUCCESS=false
          for i in $(seq 1 $MAX_ATTEMPTS); do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              "${CLEAN_URL}/rest/v1/msdt_candidates?select=id&limit=1" \
              -H "apikey: ${CLEAN_KEY}" \
              -H "Authorization: Bearer ${CLEAN_KEY}")
            echo "Percobaan $i - Response code: $response"
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "Ping berhasil, Supabase tetap aktif"
              SUCCESS=true
              break
            fi
            echo "Belum berhasil, tunggu 15 detik sebelum coba lagi..."
            sleep 15
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "Ping gagal setelah $MAX_ATTEMPTS percobaan"
            exit 1
          fi
