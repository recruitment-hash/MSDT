name: Ping Supabase Free Tier - MSDT

on:
  schedule:
    - cron: '0 0 */4 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send HTTP Request to Supabase (with retry)
        run: |
          MAX_ATTEMPTS=4
          SUCCESS=false
          for i in $(seq 1 $MAX_ATTEMPTS); do
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/msdt_candidates?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            echo "Percobaan $i - Response code: $response"
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "✅ Ping berhasil, Supabase tetap aktif"
              SUCCESS=true
              break
            fi
            echo "⏳ Belum berhasil, tunggu 15 detik sebelum coba lagi (mungkin project sedang wake-up)..."
            sleep 15
          done
          if [ "$SUCCESS" != "true" ]; then
