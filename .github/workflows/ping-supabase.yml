name: Ping Supabase Free Tier - MSDT

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose secret content
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          echo "--- Base64 of raw URL (reveals hidden chars) ---"
          echo -n "$RAW_URL" | base64
          echo "--- Hex dump of raw URL ---"
          echo -n "$RAW_URL" | od -c | head -20

      - name: Try curl with verbose output
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          CLEAN_URL=$(echo -n "$RAW_URL" | tr -d '\r\n\t ' )
          echo "Attempting curl against cleaned URL..."
          curl -v -s -o /dev/null \
            "${CLEAN_URL}/rest/v1/msdt_candidates?select=id&limit=1" \
            -H "apikey: ${RAW_KEY}" \
            -H "Authorization: Bearer ${RAW_KEY}" 2>&1 | head -30
