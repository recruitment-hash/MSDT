name: Keep Supabase Alive

on:
  schedule:
    # Runs every Monday and Thursday at noon UTC
    - cron: '0 12 * * 1,4'
  workflow_dispatch: # Lets you trigger it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (with retry)
        run: |
          MAX_ATTEMPTS=4
          SUCCESS=false
          
          for i in $(seq 1 $MAX_ATTEMPTS); do
            # Fetch HTTP status code
            response=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.SUPABASE_URL }}/rest/v1/msdt_candidates?select=id&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
            
            echo "Percobaan $i - Response code: $response"
            
            # Check if response is 2xx (Success)
            if [ "$response" -ge 200 ] && [ "$response" -lt 300 ]; then
              echo "✅ Ping berhasil, Supabase tetap aktif"
              SUCCESS=true
              break
            fi
            
            echo "⏳ Belum berhasil, tunggu 15 detik sebelum coba lagi (mungkin project sedang wake-up)..."
            sleep 15
          done
          
          # Fallback check if the main table ping failed
          if [ "$SUCCESS" != "true" ]; then
            echo "⚠️ First check failed, trying fallback check on user_progress..."
            curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/user_progress?limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          fi
